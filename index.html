<!DOCTYPE html>
<html>
    <head> 
        <link rel="stylesheet" href="index.css"></head>
    <body>
        <div id="sectionOne">
            <h1>Metric/Imperial Unit Conversion</h1>
            <div>
                <div id = "input-btn-and-box">
                    <input type="text" placeholder="Enter a number" id="input-field">  
                    <div id="buttons">
                        <button id="increment-btn">&plus;</button>
                        <button id="decrement-btn">&minus;</button>
                    </div>
                </div>
                <div>
                    <button id = "convert-btn">convert</button>
                    <button id = "reset-btn">reset</button>
                </div>  
            </div> 
        </div>

        <div id="sectionTwo">
            <h3 id="length-el">Length (Meter/feet)</h3>
            <h3 id="volume-el">Volume (Liters/Gallons)</h3>
            <h3 id="mass-el">Mass (Kilograms/Pounds)</h3>
        </div>
        <script src="index.js"></script>
    </body>
</html>
